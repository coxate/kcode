active_provider: openai

agent:
  max_iterations: 10
  max_parallel_tools: 4

# Long-term memory is opt-in because extraction/governance make additional model
# calls and confirmed memories are stored as local plaintext Markdown files.
# Only ~/.kcode/config.yaml may enable it; a project config cannot opt you in.
memory:
  enabled: false

# 项目级 MCP Server 首次连接前会请求信任。只有 env/headers 中的
# ${VAR} 会读取宿主环境；stdio 子进程不会继承其他凭据。
mcp_servers:
  local-example:
    type: stdio
    command: python
    args: ["path/to/mcp_server.py"]
    env:
      SERVICE_TOKEN: ${LOCAL_MCP_TOKEN}

  remote-example:
    type: http
    url: https://example.com/mcp
    headers:
      Authorization: "Bearer ${REMOTE_MCP_TOKEN}"

providers:
  - name: openai
    protocol: openai
    model: gpt-5-mini
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    thinking: false
    context_window: 64000

  - name: anthropic
    protocol: anthropic
    model: claude-sonnet-4-5
    base_url: https://api.anthropic.com
    api_key: ${ANTHROPIC_API_KEY}
    thinking: true
    context_window: 64000

  - name: deepseek
    protocol: openai
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}
    thinking: false
    context_window: 64000
